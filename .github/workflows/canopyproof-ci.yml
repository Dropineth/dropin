name: CanopyProof Trust Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: canopyproof-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: dropin-earth

jobs:
  trust-gate:
    name: Verify trust kernel and OpenNext artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: canopyproof_ci_test
          POSTGRES_USER: canopyproof_ci
          POSTGRES_PASSWORD: canopyproof_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canopyproof_ci -d canopyproof_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CANOPYPROOF_CI_DB_SCHEME: postgresql
      CANOPYPROOF_CI_DB_HOST: 127.0.0.1:5432
      CANOPYPROOF_CI_DB_NAME: canopyproof_ci_test
      CANOPYPROOF_CI_DB_USER: canopyproof_ci
      CANOPYPROOF_CI_DB_PASSWORD: canopyproof_ci_only
      CANOPYPROOF_NATIVE_TEST_CONFIRM: confirm-disposable-test-database
      CANOPYPROOF_LEGACY_EVIDENCE_NETWORK_ENABLED: "false"
      CANOPYPROOF_NASA_GIBS_ENABLED: "false"
      DROPIN_ALLOW_ADMIN_PROXY: "false"
      DROPIN_AUTOMATIC_CANOPY_DISTRIBUTION_ENABLED: "false"
      DROPIN_CANOPYPROOF_MODE: test
      DROPIN_MAINNET_TRANSFERS_ENABLED: "false"
      DROPIN_PHASE16_PROTOCOL_WRITES_ENABLED: "false"
      NEXT_PUBLIC_DROPIN_ENABLE_MAINNET_PAYMENTS: "false"
      NEXT_PUBLIC_CANOPYPROOF_MODE: staging
      NEXT_PUBLIC_DROPIN_SITE_URL: https://preview.example.invalid
      LIFEPP_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LIFEPP_VALIDATION_OUTPUT_DIR: reports/lifepp-validation/trust-gate-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: dropin-earth/package-lock.json

      - name: Initialize candidate-bound validation evidence
        id: evidence
        run: node scripts/lifepp-validation-run.mjs init pin-npm,install,supply-chain,workspace,native-postgres,coverage,critical-coverage,browsers,webgl,opennext,artifact,workerd-smoke,lifepp-workerd

      - name: Pin npm
        id: npm
        run: node scripts/lifepp-validation-run.mjs run pin-npm -- npm install --global npm@10.9.4

      - name: Install locked dependencies
        id: install
        run: node scripts/lifepp-validation-run.mjs run install -- npm ci --include=optional

      - name: Verify supply-chain, secret, and generated artifact boundaries
        id: supply-chain
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run supply-chain -- npm run gate:supply-chain

      - name: Run deterministic workspace gate
        id: workspace
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run workspace -- npm run ci

      - name: Verify native PostgreSQL authority paths
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/lifepp-validation-run.mjs run native-postgres -- bash -eo pipefail -c '
          connection_url="${CANOPYPROOF_CI_DB_SCHEME}://${CANOPYPROOF_CI_DB_USER}:${CANOPYPROOF_CI_DB_PASSWORD}@${CANOPYPROOF_CI_DB_HOST}/${CANOPYPROOF_CI_DB_NAME}"
          DATABASE_URL="$connection_url" \
          CANOPYPROOF_NATIVE_DATABASE_URL="$connection_url" \
            npm run db:verify:canopyproof:native
          '

      - name: Enforce repository source coverage ratchet
        id: coverage
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/lifepp-validation-run.mjs run coverage -- bash -e -c '
          set -o pipefail
          mkdir -p reports/ci
          npm run test:coverage:ratchet 2>&1 | tee reports/ci/canopyproof-coverage.txt
          test -s reports/ci/canopyproof-coverage.txt
          test -s coverage/coverage-summary.json
          '

      - name: Enforce critical CanopyProof module coverage
        id: critical-coverage
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run critical-coverage -- npm run coverage:critical

      - name: Install cross-browser WebGL fallback matrix
        id: browsers
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run browsers -- npx playwright install --with-deps chromium firefox webkit

      - name: Verify Chromium, Firefox, and WebKit fallback matrix
        id: webgl
        if: ${{ always() && !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run webgl -- npm run test:webgl:browser

      - name: Build OpenNext Cloudflare artifact
        id: opennext
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run opennext -- npm --workspace apps/web run cf:build

      - name: Verify OpenNext artifact shape
        id: artifact
        if: ${{ always() && !cancelled() && steps.opennext.outcome == 'success' }}
        run: |
          node scripts/lifepp-validation-run.mjs run artifact -- bash -e -c '
          test -f apps/web/.open-next/worker.js
          test -d apps/web/.open-next/assets
          '

      - name: Run local OpenNext workerd route smoke
        id: workerd-smoke
        if: ${{ always() && !cancelled() && steps.artifact.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run workerd-smoke -- npm run test:workerd

      - name: Verify Life++ in local workerd Chromium
        if: ${{ always() && !cancelled() && steps.artifact.outcome == 'success' && steps.browsers.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs run lifepp-workerd -- node scripts/lifepp-validation-run.mjs workerd-browser

      - name: Finalize candidate-bound validation result
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: node scripts/lifepp-validation-run.mjs finish

      - name: Preserve staging workerd build for offline visual review
        if: ${{ always() && steps.artifact.outcome == 'success' }}
        run: |
          artifact_path="$LIFEPP_VALIDATION_OUTPUT_DIR/workerd-review.tar.gz"
          tar -czf "$artifact_path" -C apps/web .open-next
          sha256sum "$artifact_path" > "$artifact_path.sha256"
          printf '%s\n' "$LIFEPP_EXPECTED_SHA" > "$LIFEPP_VALIDATION_OUTPUT_DIR/workerd-review-commit.txt"

      - name: Preserve command results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canopyproof-validation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dropin-earth/${{ env.LIFEPP_VALIDATION_OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve coverage evidence
        if: ${{ always() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: canopyproof-coverage-${{ github.run_id }}
          path: dropin-earth/${{ env.LIFEPP_VALIDATION_OUTPUT_DIR }}/artifacts/
          if-no-files-found: error
          retention-days: 30
