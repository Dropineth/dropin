name: Child synthetic Durable Object
on:
  pull_request:
    paths:
      - 'dropin-earth/integrations/cai/cloudflare-synthetic/**'
      - '.github/workflows/child-do-synthetic.yml'
      - 'dropin-earth/tests/unit/canopyproof-test-suite-contract.test.ts'
      - 'dropin-earth/services/api/src/domain/child-stewardship/signature.ts'
      - 'dropin-earth/contracts/ahin-signer-profile/v1/fixtures.json'
  push:
    branches: [main]
    paths:
      - 'dropin-earth/integrations/cai/cloudflare-synthetic/**'
      - '.github/workflows/child-do-synthetic.yml'
      - 'dropin-earth/tests/unit/canopyproof-test-suite-contract.test.ts'
      - 'dropin-earth/services/api/src/domain/child-stewardship/signature.ts'
      - 'dropin-earth/contracts/ahin-signer-profile/v1/fixtures.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: child-do-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-do:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dropin-earth/integrations/cai/cloudflare-synthetic
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: dropin-earth/integrations/cai/cloudflare-synthetic/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
