name: Publish and re-pull the pinned closed 13-migration image (registry only)

on:
  push:
    branches: [codex/child-closed-candidate-offline]
    paths:
      - '.github/workflows/child-image-publication-13.yml'

permissions:
  contents: read

concurrency:
  group: child-image-publication-13-139cb988
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && github.repository == 'Dropineth/dropin' && github.ref == 'refs/heads/codex/child-closed-candidate-offline' && github.run_attempt == 1 && github.event.before == '3aca19e3e684e66302b5c529607936ee15e1f4e8'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 139cb988a25499dc5f60d6140237d31b02260a83
          path: sources/candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.5
      - name: Verify publication control source
        run: |
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C control status --porcelain)"
          node --test control/dropin-earth/tests/unit/child-image-publication-13.test.mjs
      - name: Verify pinned main gate, native PostgreSQL and immutable tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C sources/candidate rev-parse HEAD)" = 139cb988a25499dc5f60d6140237d31b02260a83
          test "$(git -C sources/candidate rev-parse 'HEAD^{tree}')" = 80a884a8feb2a1b17e731364e7dc006deae22c31
          gh api repos/Dropineth/dropin/actions/runs/43685689778 > "$RUNNER_TEMP/child13-gate.json"
          gh api repos/Dropineth/dropin/actions/jobs/132725663380 > "$RUNNER_TEMP/child13-native.json"
          for attempt in $(seq 1 30); do
            gh api repos/Dropineth/dropin/actions/runs/43690658140 > "$RUNNER_TEMP/child13-control.json"
            gate_status="$(jq -r '.status' "$RUNNER_TEMP/child13-control.json")"
            if [ "$gate_status" = completed ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Pinned main gate did not complete inside the bounded release window.'
              exit 1
            fi
            sleep 30
          done
          gh api repos/Dropineth/dropin/actions/jobs/132740475923 > "$RUNNER_TEMP/child13-control-job.json"
          node --input-type=module - "$RUNNER_TEMP/child13-gate.json" "$RUNNER_TEMP/child13-native.json" "$RUNNER_TEMP/child13-control.json" "$RUNNER_TEMP/child13-control-job.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {SOURCES, VERIFIED_GATE_RUN, VERIFIED_GATE_JOB} from './control/dropin-earth/scripts/child-image-publication-13.mjs';
          const [run, job, controlRun, controlJob] = process.argv.slice(2).map(path => JSON.parse(readFileSync(path,'utf8')));
          assert.equal(String(run.id), VERIFIED_GATE_RUN);
          assert.equal(run.name, 'CanopyProof Trust Gate');
          assert.equal(run.repository.full_name.toLowerCase(), 'dropineth/dropin');
          assert.equal(run.event, 'push');
          assert.equal(run.head_branch, 'main');
          assert.equal(run.head_sha, SOURCES.candidate);
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.equal(String(job.id), VERIFIED_GATE_JOB);
          assert.equal(String(job.run_id), VERIFIED_GATE_RUN);
          assert.equal(job.head_sha, SOURCES.candidate);
          assert.equal(job.conclusion, 'success');
          assert.ok(job.steps.some(step => step.name === 'Verify native PostgreSQL authority paths' && step.conclusion === 'success'));
          assert.equal(controlRun.id, 43690658140);
          assert.equal(controlRun.repository.full_name.toLowerCase(), 'dropineth/dropin');
          assert.equal(controlRun.name, 'CanopyProof Trust Gate');
          assert.equal(controlRun.event, 'push');
          assert.equal(controlRun.head_branch, 'main');
          assert.equal(controlRun.head_sha, '0761a84b94bbc0521e294efba1e6907fd776d6d2');
          assert.equal(controlRun.status, 'completed');
          assert.equal(controlRun.conclusion, 'success');
          assert.equal(controlJob.id, 132740475923);
          assert.equal(controlJob.run_id, controlRun.id);
          assert.equal(controlJob.head_sha, controlRun.head_sha);
          assert.equal(controlJob.conclusion, 'success');
          assert.ok(controlJob.steps.some(step => step.name === 'Run deterministic workspace gate' && step.conclusion === 'success'));
          NODE
      - name: Authenticate package publication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish exact closed candidate image and preserve manifest digests
        run: node control/dropin-earth/scripts/child-image-publication-13.mjs publish sources publication
      - name: Logout package session
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: child-image-publication-${{ github.run_id }}
          path: publication/
          if-no-files-found: error
          retention-days: 30

  fresh-pull:
    if: github.event_name == 'push' && github.repository == 'Dropineth/dropin' && github.ref == 'refs/heads/codex/child-closed-candidate-offline' && github.run_attempt == 1 && github.event.before == '3aca19e3e684e66302b5c529607936ee15e1f4e8'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.5
      - name: Verify fresh-runner control source
        run: |
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C control status --porcelain)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: child-image-publication-${{ github.run_id }}
          path: publication
      - name: Authenticate read-only package pull
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull the exact candidate registry digest on a fresh runner and prove closed runtime
        run: node control/dropin-earth/scripts/child-image-publication-13.mjs fresh-pull publication/publication.json verification
      - name: Logout package session
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: child-image-fresh-pull-${{ github.run_id }}
          path: verification/
          if-no-files-found: error
          retention-days: 30
