# LOCAL TEMPLATE ONLY. Reverify the existing exact branch's Cloudflare exclusion
# immediately before any authorized upload; this file grants no deployment.
name: CanopyProof isolated separate database rollback
on:
  push:
    branches: ['codex/child-closed-candidate-offline']
    paths:
      - '.github/workflows/child-separated-rollback.yml'
      - 'ci/child-separated-rollback/**'
permissions:
  contents: read
concurrency:
  group: canopyproof-child-separated-rollback
  cancel-in-progress: false
jobs:
  rehearse:
    if: github.repository == 'Dropineth/dropin' && github.ref == 'refs/heads/codex/child-closed-candidate-offline'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out only the test harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: harness
          sparse-checkout: ci/child-separated-rollback
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 0e3d33b36beac4502488b18a0707c17fd34062e5
          path: candidate
      - name: Check out exact distinct rollback
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 1d2efaa5258b70ed9f815af0ebf7109443734e59
          path: rollback
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
      - name: Test and execute isolated rehearsal
        shell: bash
        run: |
          set -euo pipefail
          harness="$GITHUB_WORKSPACE/harness/ci/child-separated-rollback"
          bash -n "$harness/rehearse.sh"
          node --test "$harness/"*.test.mjs
          bash "$harness/rehearse.sh" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/rollback" "$RUNNER_TEMP/child-separated-rollback"
      - name: Upload only sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: child-separated-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/child-separated-rollback/receipt.json
          retention-days: 7
          if-no-files-found: warn
