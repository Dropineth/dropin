name: CanopyProof Production Deploy
run-name: Web release ${{ inputs.expected_commit_sha }} — independent approval required

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: 'Exact reviewed PR #4 merge SHA at main tip (40 lowercase hex characters).'
        type: string
        required: true
      rollback_version_id:
        description: 'Existing known-good canopyproof-web version UUID currently serving 100%.'
        type: string
        required: true
      rollback_deployment_id:
        description: 'Existing active deployment UUID containing that rollback version.'
        type: string
        required: true
      maintainer_attestation_url:
        description: 'PR #4 maintainer JSON comment confirming Git publishing path, real rollback and visual evidence; see R3_RELEASE_AUDIT.md.'
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  deployments: read

concurrency:
  group: canopyproof-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: dropin-earth

env:
  LIFEPP_RELEASE_SHA: ${{ inputs.expected_commit_sha }}
  LIFEPP_ROLLBACK_VERSION: ${{ inputs.rollback_version_id }}
  LIFEPP_ROLLBACK_DEPLOYMENT: ${{ inputs.rollback_deployment_id }}
  LIFEPP_ATTESTATION_URL: ${{ inputs.maintainer_attestation_url }}
  LIFEPP_RELEASE_DIR: reports/lifepp-release
  NEXT_PUBLIC_CANOPYPROOF_MODE: production
  NEXT_PUBLIC_DROPIN_SITE_URL: https://canopyproof.org
  DROPIN_ALLOW_ADMIN_PROXY: 'false'
  DROPIN_MAINNET_TRANSFERS_ENABLED: 'false'
  DROPIN_PHASE16_PROTOCOL_WRITES_ENABLED: 'false'
  NEXT_PUBLIC_DROPIN_ENABLE_MAINNET_PAYMENTS: 'false'
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  prepare:
    name: Prepare exact-SHA web artifact without cloud credentials
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    steps:
      - name: Reject an untrusted checkout before executing repository code
        working-directory: ${{ github.workspace }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$LIFEPP_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$LIFEPP_RELEASE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: dropin-earth/package-lock.json
      - name: Verify main, independent PR review, maintainer declaration and complete same-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lifepp-release-run.mjs prepare
      - name: Pin npm and install the frozen dependency graph
        run: |
          npm install --global npm@10.9.4
          npm ci --include=optional
      - name: Build the production OpenNext output explicitly
        run: npm --workspace apps/web run cf:build
      - name: Seal the artifact and display the exact approval comment
        id: seal
        run: node scripts/lifepp-release-run.mjs seal
      - name: Preserve reviewable build and SHA-bound manifest
        uses: actions/upload-artifact@v4
        with:
          name: lifepp-release-${{ inputs.expected_commit_sha }}-${{ github.run_id }}
          path: dropin-earth/reports/lifepp-release/
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Approve and deploy only canopyproof-web at ${{ inputs.expected_commit_sha }}
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: canopyproof-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIFEPP_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
      LIFEPP_PROTECTED_JOB: canopyproof-production
    steps:
      - name: Reject a different or rerun checkout before exposing release credentials
        working-directory: ${{ github.workspace }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$LIFEPP_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$LIFEPP_RELEASE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: dropin-earth/package-lock.json
      - name: Install pinned deploy tools without cloud credentials
        run: |
          npm install --global npm@10.9.4
          npm ci --include=optional
      - uses: actions/download-artifact@v4
        with:
          name: lifepp-release-${{ inputs.expected_commit_sha }}-${{ github.run_id }}
          path: dropin-earth/reports/lifepp-release/
      - name: Verify and restore the reviewed artifact without rebuilding
        run: node scripts/lifepp-release-run.mjs restore
      - name: Verify real environment approval, rollback and routes; deploy existing web Worker only
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID_PROD }}
          WORKER_ZONE_ID_PROD: ${{ secrets.WORKER_ZONE_ID_PROD }}
        run: node scripts/lifepp-release-run.mjs deploy
      - name: Preserve actual deployment and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifepp-release-receipt-${{ inputs.expected_commit_sha }}-${{ github.run_id }}
          path: dropin-earth/reports/lifepp-release/
          if-no-files-found: error
          retention-days: 30
