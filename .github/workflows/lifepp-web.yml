name: Life++ web acceptance
on:
  pull_request:
    paths:
      - 'dropin-earth/apps/web/**'
      - 'dropin-earth/tests/unit/lifepp-*.test.ts'
      - 'dropin-earth/tests/browser/lifepp*.ts'
      - 'dropin-earth/scripts/lifepp-*.mjs'
      - '.github/workflows/lifepp-web.yml'
permissions:
  contents: read
concurrency:
  group: lifepp-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dropin-earth
    env:
      NEXT_PUBLIC_CANOPYPROOF_MODE: staging
      NEXT_PUBLIC_DROPIN_SITE_URL: https://preview.example.invalid
      LIFEPP_BROWSER_OUTPUT_DIR: reports/lifepp-browser/next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: dropin-earth/package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci --include=optional
      - run: npm --workspace apps/web run typecheck
      - run: npm run lint
      - run: npm --workspace apps/web run test:lifepp
      - run: npm --workspace apps/web run build
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p reports/lifepp-browser && node --import tsx tests/browser/lifepp-scene-viewer.spec.ts > reports/lifepp-browser/viewer-fixture-report.json
      - run: npm --workspace apps/web run test:lifepp:browser
      - name: Preserve bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifepp-browser-${{ github.run_id }}
          path: dropin-earth/reports/lifepp-browser/
          if-no-files-found: warn
