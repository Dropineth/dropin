apiVersion: v1
kind: Namespace
metadata:
  name: canopyproof
  labels:
    app.kubernetes.io/name: canopyproof
    app.kubernetes.io/part-of: dropin-earth
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canopyproof-api-config
  namespace: canopyproof
data:
  NODE_ENV: "production"
  DROPIN_REPOSITORY: "postgres"
  DROPIN_CANOPYPROOF_MODE: "production"
  DROPIN_ALLOW_ADMIN_PROXY: "false"
  OTEL_SERVICE_NAME: "canopyproof-api"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=dropin-earth,deployment.environment=production"
  CANOPYPROOF_OTEL_EXPORT_ENABLED: "false"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/json"
  CANOPYPROOF_OTEL_ALLOW_PRIVATE_HTTP: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: canopyproof-api-secrets
  namespace: canopyproof
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_POSTGRESQL_URL_FROM_SECRET_MANAGER"
  CANOPYPROOF_OBJECT_STORAGE_URL: "REPLACE_WITH_R2_OR_S3_URL_FROM_SECRET_MANAGER"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canopyproof-api
  namespace: canopyproof
  labels:
    app.kubernetes.io/name: canopyproof-api
    app.kubernetes.io/part-of: dropin-earth
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: canopyproof-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canopyproof-api
        app.kubernetes.io/part-of: dropin-earth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/dropineth/dropin/canopyproof-api:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: canopyproof-api-config
            - secretRef:
                name: canopyproof-api-secrets
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: canopyproof-api
  namespace: canopyproof
  labels:
    app.kubernetes.io/name: canopyproof-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: canopyproof-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: canopyproof-api
  namespace: canopyproof
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: canopyproof-api
